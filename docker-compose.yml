# Laravel Sail-style Docker Compose setup:
#   - Default (CPU, all members):  docker compose up
#   - Member A (RTX 3070 GPU):     docker compose --profile gpu up -d gpu
#                                  docker compose --profile gpu exec gpu uv run pytest

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - REGQA_API_MODE=${REGQA_API_MODE:-replay}
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - ./data:/app/data
      - ./runs:/app/runs
      - ./scripts:/app/scripts
      - ./tests:/app/tests
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_PROXY_TARGET=http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: docker/gpu.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - ./data:/app/data
      - ./runs:/app/runs
      - ./results:/app/results
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  frontend_node_modules:
  hf_cache:
