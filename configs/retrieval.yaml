# Chunking and retrieval parameters (Member B owns; see docs/project_spec.md §5.1 & §6)
# Candidate model from the spec. Confirm with the team before using real dev data.
embedding_model: "BAAI/bge-m3"
embedding_revision: "5617a9f61b028005a4858fdac845db406aefb181"
chunk_tokenizer: "BAAI/bge-m3"
budget_tokenizer: "Qwen/Qwen3-0.6B"  # conservative tokenizer for prompt budget check
budget_tokenizer_revision: "c1899de289a04d12100db370d81485cdf75e47ca"

chunking:
  candidates: [128, 256, 384, 512]
  max_chunk_tokens: null  # set by scripts / calibrate_chunks.py (§5.1)
  overlap_ratio: 0.12
  header_template: "[Chapter {chapter} > Article {article}]"

retrieval:
  method: "hybrid_rrf"
  rrf_k: 60
  faiss_index: "IndexFlatIP"
  normalize_embeddings: true
  cache_k: 5
  top_k_context: 4
  prompt_token_budget: 2500

calibration:
  bootstrap_samples: 2000
  seed: 42
