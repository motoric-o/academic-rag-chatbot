[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "academic-rag-chatbot"
version = "0.1.0"
description = "Model Scaling in Grounded Regulation QA: local quantized Qwen3 vs. hosted open-weight models on a fixed RAG pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Core config & data
    "pyyaml>=6.0.2",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    # PDF & corpus ingestion (Member B)
    "pymupdf>=1.24.0",
    # Retrieval (Member B, CPU-safe)
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.1.0",
    # Hosted inference & API (Member C)
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Stats & plotting (Members A, B, D)
    "numpy>=1.26.4,<2.0",
    "scipy>=1.14.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    # Tokenizers (used CPU-only for chunk calibration & A1 tokenizer stats)
    "transformers>=4.51.0",
    "tokenizers>=0.21.0",
]

[project.optional-dependencies]
# Member A: local GPU inference & quantization (RTX 3070 / Colab / Kaggle)
local = [
    "accelerate>=1.0.0",
    "bitsandbytes>=0.44.0",
]
# Member B / D: Gemini API client for translation & secondary judge
gemini = [
    "google-genai>=1.0.0",
]
# Dev & testing tools
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/regqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
